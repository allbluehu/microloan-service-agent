services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: microloan
      POSTGRES_USER: microloan
      POSTGRES_PASSWORD: microloan
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microloan -d microloan"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - microloan-postgres:/var/lib/postgresql/data

volumes:
  microloan-postgres:
