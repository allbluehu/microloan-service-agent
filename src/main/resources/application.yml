spring:
  application:
    name: microloan-service-agent
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/microloan}
    username: ${DB_USERNAME:microloan}
    password: ${DB_PASSWORD:microloan}
  servlet:
    multipart:
      max-file-size: ${KNOWLEDGE_PDF_MAX_BYTES:10MB}
      max-request-size: ${KNOWLEDGE_PDF_MAX_REQUEST_SIZE:11MB}
  ai:
    retry:
      # 模型读取仅有限重试；认证、参数等确定性 4xx 错误立即失败并进入规则降级。
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:2}
      on-client-errors: false
      on-http-codes: 429
      exclude-on-http-codes: 400,401,403,404,422
      backoff:
        initial-interval: ${AI_RETRY_INITIAL_INTERVAL:200ms}
        multiplier: 2
        max-interval: ${AI_RETRY_MAX_INTERVAL:1s}
    model:
      chat: ${AI_CHAT_MODEL:none}
      embedding: ${AI_EMBEDDING_MODEL:none}
    openai:
      # 百炼、GLM 等供应商均通过 OpenAI 兼容协议接入，业务代码不绑定具体厂商 SDK。
      api-key: ${AI_API_KEY:unused-when-ai-disabled}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        completions-path: ${AI_CHAT_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${AI_CHAT_MODEL_NAME:qwen-plus}
          temperature: 0
      embedding:
        embeddings-path: ${AI_EMBEDDINGS_PATH:/embeddings}
        options:
          # 数据库列固定为 VECTOR(1024)，切换维度前必须同步修改 DDL 并重建全部向量。
          model: ${AI_EMBEDDING_MODEL_NAME:text-embedding-v4}
          dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}

knowledge:
  admin:
    # 未配置独立管理密钥时，知识治理 API 保持不可访问。
    api-key: ${KNOWLEDGE_ADMIN_API_KEY:}
  ingestion:
    chunk-max-characters: ${KNOWLEDGE_CHUNK_MAX_CHARACTERS:800}
    markdown-max-bytes: ${KNOWLEDGE_MARKDOWN_MAX_BYTES:1048576}
    classpath-bootstrap-enabled: ${KNOWLEDGE_CLASSPATH_BOOTSTRAP_ENABLED:false}
    pdf-max-bytes: ${KNOWLEDGE_PDF_MAX_BYTES:10485760}
    pdf-max-pages: ${KNOWLEDGE_PDF_MAX_PAGES:100}
  vector:
    enabled: ${KNOWLEDGE_VECTOR_ENABLED:false}
    indexing-enabled: ${KNOWLEDGE_VECTOR_INDEXING_ENABLED:false}
    model: ${AI_EMBEDDING_MODEL_NAME:text-embedding-v4}

agent:
  risk:
    # 默认关闭风险模型，明确规则始终生效；开启后用于补充识别隐晦风险。
    model-enabled: ${AI_RISK_MODEL_ENABLED:false}
    model-confidence-threshold: ${AI_RISK_MODEL_CONFIDENCE_THRESHOLD:0.75}
  model-call:
    # 覆盖 Spring AI 内部有限重试在内的整次分类调用预算。
    timeout: ${AI_MODEL_CALL_TIMEOUT:3s}
    # 限制单实例同时进行的模型调用，容量耗尽时立即进入规则降级而非继续排队。
    max-concurrent: ${AI_MODEL_MAX_CONCURRENT:20}
    circuit-breaker:
      failure-threshold: ${AI_CIRCUIT_FAILURE_THRESHOLD:3}
      open-duration: ${AI_CIRCUIT_OPEN_DURATION:30s}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

security:
  jwt:
    # Local default is intentionally non-production; deployments must provide a 32+ byte secret.
    secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes}
    ttl: 1h
    step-up-ttl: 5m

management:
  endpoint:
    health:
      # 对外只返回聚合状态，避免数据库、磁盘等内部组件信息泄露。
      show-details: never
      probes:
        enabled: true
      group:
        # 存活探针不依赖外部资源，避免数据库短暂故障触发无效的进程重启。
        liveness:
          include: livenessState
        # 就绪探针纳入数据库，故障实例会退出流量但保持进程供诊断与恢复。
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info

support:
  # 独立坐席密钥，空值时关闭坐席 API。
  api-key: ${SUPPORT_API_KEY:}
