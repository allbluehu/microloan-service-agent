<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微贷智能客服测试台</title>
  <style>
    :root { color-scheme: light; --ink:#17231f; --muted:#66736d; --line:#dce5df; --brand:#176b4d; --soft:#eef7f2; --danger:#a33a31; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font:14px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif; color:var(--ink); background:linear-gradient(135deg,#edf6f0,#f7f3e9); }
    button,input,textarea { font:inherit; }
    .shell { max-width:1180px; min-height:100vh; margin:auto; padding:28px; display:grid; grid-template-columns:300px 1fr; gap:20px; }
    .panel { background:rgba(255,255,255,.92); border:1px solid rgba(255,255,255,.8); border-radius:20px; box-shadow:0 16px 45px rgba(31,61,48,.09); }
    aside { padding:22px; }
    h1 { margin:0 0 4px; font-size:21px; }
    h2 { margin:24px 0 10px; font-size:13px; letter-spacing:.08em; color:var(--muted); }
    .sub,.hint { color:var(--muted); }
    label { display:block; margin:11px 0 5px; font-size:12px; color:var(--muted); }
    input,textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--ink); background:#fff; outline:none; }
    input:focus,textarea:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(23,107,77,.1); }
    button { border:0; border-radius:10px; padding:10px 16px; color:#fff; background:var(--brand); cursor:pointer; font-weight:650; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .secondary { width:100%; margin-top:14px; color:var(--brand); background:var(--soft); }
    .status { display:flex; align-items:center; gap:8px; margin-top:12px; color:var(--muted); }
    .dot { width:9px; height:9px; border-radius:50%; background:#aeb8b3; }
    .online .dot { background:#31a36f; box-shadow:0 0 0 4px #dff4e9; }
    main { min-height:calc(100vh - 56px); display:flex; flex-direction:column; overflow:hidden; }
    header { padding:20px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    .messages { flex:1; padding:24px; overflow:auto; }
    .empty { height:100%; display:grid; place-content:center; text-align:center; color:var(--muted); }
    .message { max-width:78%; margin:0 0 18px; }
    .message.user { margin-left:auto; }
    .bubble { padding:13px 15px; border-radius:15px 15px 15px 4px; background:var(--soft); white-space:pre-wrap; overflow-wrap:anywhere; }
    .user .bubble { color:#fff; background:var(--brand); border-radius:15px 15px 4px 15px; }
    .meta { margin:5px 4px 0; font-size:11px; color:var(--muted); }
    details { margin-top:8px; }
    pre { margin:7px 0 0; padding:12px; border-radius:10px; overflow:auto; font-size:12px; background:#15231e; color:#d9eee5; }
    .composer { padding:18px 22px; border-top:1px solid var(--line); }
    textarea { min-height:74px; resize:vertical; }
    .actions { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-top:10px; }
    .error { color:var(--danger); }
    @media (max-width:760px) { .shell { padding:10px; grid-template-columns:1fr; } main { min-height:70vh; } .message { max-width:92%; } }
  </style>
</head>
<body>
<div class="shell">
  <aside class="panel">
    <h1>微贷 Agent 测试台</h1>
    <div class="sub">登录后直接调用当前服务的真实接口</div>

    <h2>客户登录</h2>
    <label for="customerNo">客户编号</label>
    <input id="customerNo" value="C10001" autocomplete="username">
    <label for="password">密码</label>
    <input id="password" type="password" value="Demo123!" autocomplete="current-password">
    <button id="login" class="secondary">登录 / 刷新令牌</button>
    <div id="status" class="status"><span class="dot"></span><span>尚未登录</span></div>

    <h2>会话参数</h2>
    <label for="sessionId">会话 ID</label>
    <input id="sessionId" value="S-WEB-TEST">
    <label for="loanId">贷款编号（可选）</label>
    <input id="loanId" value="L10001">
    <label for="applicationId">申请编号（可选）</label>
    <input id="applicationId" placeholder="例如 A10001">
    <label for="productCode">产品编码（可选）</label>
    <input id="productCode" placeholder="例如 MICRO_BUSINESS">
    <label for="region">地区编码（可选）</label>
    <input id="region" placeholder="例如 CN-SH">
  </aside>

  <main class="panel">
    <header><div><strong>对话调试</strong><div class="hint">Enter 发送，Shift + Enter 换行</div></div><span id="modelState" class="hint">等待登录</span></header>
    <section id="messages" class="messages"><div class="empty">可以尝试：我下个月要还多少钱？</div></section>
    <section class="composer">
      <textarea id="content" placeholder="输入客户问题……">我下个月要还多少钱？</textarea>
      <div class="actions"><span id="requestState" class="hint">响应会展示意图、Trace ID 和业务卡片</span><button id="send">发送消息</button></div>
    </section>
  </main>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let accessToken = sessionStorage.getItem("microloanAccessToken") || "";

  function setLoginState(loggedIn, text) {
    $("status").classList.toggle("online", loggedIn);
    $("status").lastElementChild.textContent = text;
    $("modelState").textContent = loggedIn ? "JWT 已就绪" : "等待登录";
  }

  async function request(path, options = {}) {
    const response = await fetch(path, {
      ...options,
      headers: { "Content-Type": "application/json", ...(accessToken ? { Authorization: `Bearer ${accessToken}` } : {}), ...options.headers }
    });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.message || body.error || `HTTP ${response.status}`);
    return body;
  }

  $("login").addEventListener("click", async () => {
    $("login").disabled = true;
    try {
      const result = await request("/api/v1/auth/login", { method:"POST", body:JSON.stringify({ customerNo:$("customerNo").value.trim(), password:$("password").value }) });
      accessToken = result.accessToken;
      // 令牌仅存于当前浏览器标签页，关闭标签后即清除，降低测试密钥残留风险。
      sessionStorage.setItem("microloanAccessToken", accessToken);
      setLoginState(true, `已登录，有效期 ${result.expiresIn} 秒`);
    } catch (error) { setLoginState(false, error.message); }
    finally { $("login").disabled = false; }
  });

  function appendMessage(role, text, detail) {
    const empty = $("messages").querySelector(".empty");
    if (empty) empty.remove();
    const item = document.createElement("article");
    item.className = `message ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    item.appendChild(bubble);
    if (detail) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = detail.summary;
      item.appendChild(meta);
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = "查看原始响应";
      const pre = document.createElement("pre");
      pre.textContent = JSON.stringify(detail.raw, null, 2);
      details.append(summary, pre);
      item.appendChild(details);
    }
    $("messages").appendChild(item);
    item.scrollIntoView({ behavior:"smooth", block:"end" });
  }

  async function sendMessage() {
    const content = $("content").value.trim();
    if (!content) return;
    if (!accessToken) { $("requestState").textContent = "请先登录"; $("requestState").className = "error"; return; }
    const sessionId = $("sessionId").value.trim();
    if (!sessionId) { $("requestState").textContent = "请填写会话 ID"; return; }
    appendMessage("user", content);
    $("send").disabled = true;
    $("requestState").className = "hint";
    $("requestState").textContent = "Agent 正在处理……";
    const optional = (id) => $(id).value.trim() || null;
    try {
      const result = await request(`/api/v1/chat/sessions/${encodeURIComponent(sessionId)}/messages`, {
        method:"POST",
        body:JSON.stringify({ messageId:`WEB-${crypto.randomUUID()}`, content, selectedLoanId:optional("loanId"), selectedApplicationId:optional("applicationId"), selectedProductCode:optional("productCode"), selectedRegion:optional("region"), settlementDate:null })
      });
      appendMessage("assistant", result.answer || "（无文本答案）", { summary:`意图：${result.intent} · Trace：${result.traceId}`, raw:result });
      $("content").value = "";
      $("requestState").textContent = "请求成功";
    } catch (error) {
      appendMessage("assistant", `请求失败：${error.message}`);
      $("requestState").className = "error";
      $("requestState").textContent = error.message;
    } finally { $("send").disabled = false; $("content").focus(); }
  }

  $("send").addEventListener("click", sendMessage);
  $("content").addEventListener("keydown", (event) => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); sendMessage(); } });
  setLoginState(Boolean(accessToken), accessToken ? "已恢复当前标签页令牌" : "尚未登录");
</script>
</body>
</html>
